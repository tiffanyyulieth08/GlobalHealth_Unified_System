services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-globalhealth}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping')"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  postgres-primary:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-globalhealth}-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globalhealth}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-globalhealth_replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-change-replication-me}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/primary-postgresql.conf
      - -c
      - hba_file=/etc/postgresql/primary-pg_hba.conf
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'SELECT pg_is_in_recovery()')" = f
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  postgres-replica:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-globalhealth}-postgres-replica:local
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globalhealth}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-globalhealth_replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-change-replication-me}
    entrypoint:
      - replica-entrypoint.sh
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'SELECT pg_is_in_recovery()')" = t && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'SELECT status FROM pg_stat_wal_receiver')" = streaming
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  fragment-public:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${FRAGMENT_PUBLIC_DB:-globalhealth_public}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRAGMENT_FDW_PASSWORD: ${FRAGMENT_FDW_PASSWORD:-change-me}
    volumes:
      - ./database/postgres/fragmentation/vertical/public:/docker-entrypoint-initdb.d:ro
      - postgres-fragment-public-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  fragment-financial:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${FRAGMENT_FINANCIAL_DB:-globalhealth_financial}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRAGMENT_FDW_PASSWORD: ${FRAGMENT_FDW_PASSWORD:-change-me}
    volumes:
      - ./database/postgres/fragmentation/vertical/financial:/docker-entrypoint-initdb.d:ro
      - postgres-fragment-financial-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  fragmentation-coordinator:
    build:
      context: .
      dockerfile: docker/postgres/fragmentation/coordinator/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-globalhealth}-fragmentation-coordinator:local
    depends_on:
      fragment-public:
        condition: service_healthy
      fragment-financial:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${FRAGMENT_COORDINATOR_DB:-globalhealth}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRAGMENT_PUBLIC_DB: ${FRAGMENT_PUBLIC_DB:-globalhealth_public}
      FRAGMENT_FINANCIAL_DB: ${FRAGMENT_FINANCIAL_DB:-globalhealth_financial}
      FRAGMENT_FDW_PASSWORD: ${FRAGMENT_FDW_PASSWORD:-change-me}
    volumes:
      - ./database/postgres/fragmentation/vertical/coordinator:/docker-entrypoint-initdb.d:ro
      - postgres-fragmentation-coordinator-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  fragment-north:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${FRAGMENT_NORTH_DB:-globalhealth_north}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRAGMENT_HORIZONTAL_FDW_PASSWORD: ${FRAGMENT_HORIZONTAL_FDW_PASSWORD:-change-me}
    volumes:
      - ./database/postgres/fragmentation/horizontal/north:/docker-entrypoint-initdb.d:ro
      - postgres-fragment-north-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  fragment-south:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${FRAGMENT_SOUTH_DB:-globalhealth_south}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRAGMENT_HORIZONTAL_FDW_PASSWORD: ${FRAGMENT_HORIZONTAL_FDW_PASSWORD:-change-me}
    volumes:
      - ./database/postgres/fragmentation/horizontal/south:/docker-entrypoint-initdb.d:ro
      - postgres-fragment-south-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  fragmentation-coordinator-horizontal:
    build:
      context: .
      dockerfile: docker/postgres/fragmentation/coordinator/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-globalhealth}-fragmentation-coordinator-horizontal:local
    depends_on:
      fragment-north:
        condition: service_healthy
      fragment-south:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${FRAGMENT_HORIZONTAL_COORDINATOR_DB:-globalhealth_horizontal}
      POSTGRES_USER: ${POSTGRES_USER:-globalhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      FRAGMENT_NORTH_DB: ${FRAGMENT_NORTH_DB:-globalhealth_north}
      FRAGMENT_SOUTH_DB: ${FRAGMENT_SOUTH_DB:-globalhealth_south}
      FRAGMENT_HORIZONTAL_FDW_PASSWORD: ${FRAGMENT_HORIZONTAL_FDW_PASSWORD:-change-me}
    volumes:
      - ./database/postgres/fragmentation/horizontal/coordinator:/docker-entrypoint-initdb.d:ro
      - postgres-fragmentation-horizontal-coordinator-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - globalhealth-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-GlobalHealth_Unified_System}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      POSTGRES_WRITE_URL: postgresql://${POSTGRES_USER:-globalhealth}:${POSTGRES_PASSWORD:-change-me}@postgres-primary:5432/${POSTGRES_DB:-globalhealth}
      POSTGRES_READ_URL: postgresql://${POSTGRES_USER:-globalhealth}:${POSTGRES_PASSWORD:-change-me}@postgres-replica:5432/${POSTGRES_DB:-globalhealth}
      MONGODB_PROVIDER: ${MONGODB_PROVIDER:-local}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/globalhealth}
      MONGODB_DB: ${MONGODB_DB:-globalhealth}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/databases')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - globalhealth-network
      - globalhealth-edge-network
    restart: unless-stopped

networks:
  globalhealth-network:
    internal: true
  globalhealth-edge-network:
    driver: bridge

volumes:
  mongodb-data:
  postgres-primary-data:
  postgres-replica-data:
  postgres-fragment-public-data:
  postgres-fragment-financial-data:
  postgres-fragmentation-coordinator-data:
  postgres-fragment-north-data:
  postgres-fragment-south-data:
  postgres-fragmentation-horizontal-coordinator-data:
