name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate YAML and Compose
        env:
          MONGODB_URI: mongodb+srv://placeholder.invalid/globalhealth
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          for pattern in ("*.yaml", "*.yml"):
              for path in pathlib.Path(".").rglob(pattern):
                  with path.open(encoding="utf-8") as stream:
                      yaml.safe_load(stream)
                  print(f"valid YAML: {path}")
          PY
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.atlas.yaml config --quiet

      - name: Compile and run backend unit tests
        env:
          PYTHONPATH: backend
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend/tests -v

      - name: Validate shell scripts
        run: |
          find scripts tests docker database -type f -name '*.sh' -print0 |
            xargs -0 -n1 sh -n

      - name: Check line endings and whitespace
        run: |
          if git grep -Il $'\r' -- '*.sh' '*.sql' '*.py' '*.yaml' '*.yml'; then
            echo "CRLF line endings found in files that require LF" >&2
            exit 1
          fi
          git diff --check

      - name: Search tracked files for secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)'; then
            echo "A real environment file is tracked" >&2
            exit 1
          fi
          python - <<'PY'
          import pathlib
          import re
          import subprocess

          uri = re.compile(r"(?:mongodb(?:\+srv)?|postgres(?:ql)?)://[^\s\"']+:[^\s@\"']+@")
          private_key = re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")
          safe_markers = ("${", "<username>", "<password>", "USUARIO", "CONTRASENA", "change-me")
          violations = []
          for name in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              if name == ".github/workflows/ci.yml":
                  continue
              path = pathlib.Path(name)
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(content.splitlines(), 1):
                  match = uri.search(line)
                  if match and not any(marker in match.group(0) for marker in safe_markers):
                      violations.append(f"{name}:{number}: credential-bearing URI")
                  if private_key.search(line):
                      violations.append(f"{name}:{number}: private key")
          if violations:
              raise SystemExit("\n".join(violations))
          print("No tracked credential patterns found.")
          PY
